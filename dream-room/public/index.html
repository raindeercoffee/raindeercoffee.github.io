<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111e32" />
  <meta name="description" content="夢的部屋：不必交談，也可以安靜地待在一起。" />
  <title>夢的部屋</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./controls.css" />
  <script type="module" src="./app.js"></script>
  <script type="module" src="./ambience.js"></script>
</head>
<body>
  <div id="app">
    <header class="site-header quiet-ui">
      <button type="button" class="brand" id="go-home" data-home-text="brand" style="--home-item-scale:1;--home-item-color:#bec8cf" aria-label="離開房間，返回入口">夢的部屋</button>
    </header>
    <main id="lobby" class="lobby">
      <div class="intro">
        <h1 data-home-text="intro" style="--home-item-scale:0.85;--home-item-color:#eef0e8">不必說話，也有人相伴。</h1>
      </div>
      <div class="room-cards">
        <button class="room-card" type="button" data-room="dream-a">
          <div class="room-card-art night-art"></div>
          <div class="room-card-info"><div><h2 data-home-text="night-name" style="--home-item-scale:0.85;--home-item-color:#eef0e8">夜潮</h2><p data-home-text="night-description" style="--home-item-scale:1;--home-item-color:#bec8cf">讓心事，慢慢沉入夜色。</p></div><span class="count" id="dream-a-count" data-home-text="night-count" style="--home-item-scale:0.85;--home-item-color:#bec8cf">— / 10</span></div>
        </button>
        <button class="room-card" type="button" data-room="dream-b">
          <div class="room-card-art mist-art"></div>
          <div class="room-card-info"><div><h2 data-home-text="mist-name" style="--home-item-scale:0.85;--home-item-color:#eef0e8">霧藍</h2><p data-home-text="mist-description" style="--home-item-scale:1;--home-item-color:#bec8cf">在淡淡的藍裡，安穩休息。</p></div><span class="count" id="dream-b-count" data-home-text="mist-count" style="--home-item-scale:0.85;--home-item-color:#bec8cf">— / 10</span></div>
        </button>
      </div>
      <p id="lobby-message" class="sr-only" role="status" aria-live="polite">正在看看房間裡有多少人……</p>
      <p class="lobby-footnote" data-home-text="footnote" style="--home-item-scale:1.05;--home-item-color:#bec8cf">隨機成為一顆夢球 · 不用帳號，也沒有聊天，但每一個都是真實的陪伴</p>
    </main>
    <main id="room-view" class="room-view hidden">
      <section class="room-toolbar quiet-ui" aria-label="房間資訊">
        <h1 id="room-name" tabindex="-1">夜潮</h1>
        <span class="room-population" id="population">—人在這裡</span>
        <button type="button" class="glass-button" id="back-btn" aria-label="離開房間"><svg aria-hidden="true"><use href="./assets/controls-icons.svg#icon-exit"></use></svg></button>
      </section>
      <div class="canvas-shell">
        <div id="scene" class="scene" data-room="dream-a" role="group" aria-label="夜潮陪睡房"><div id="visitors" class="visitors"></div></div>
      </div>
      <section class="room-controls" aria-label="動作、亮度與聲音">
        <div class="side-controls side-left quiet-ui">
          <div class="control-group" id="modes" aria-label="我的姿態"></div>
          <button type="button" id="brightness-toggle" class="glass-button" data-panel-toggle="brightness-panel" aria-label="場景亮度" aria-controls="brightness-panel" aria-expanded="false"><svg aria-hidden="true"><use href="./assets/controls-icons.svg#icon-brightness"></use></svg></button>
        </div>
        <div class="side-controls side-right quiet-ui">
          <button type="button" id="noise-toggle" class="glass-button" data-panel-toggle="sound-panel" aria-label="選擇環境聲音，目前靜音" aria-controls="sound-panel" aria-expanded="false" aria-pressed="false"><svg aria-hidden="true"><use href="./assets/controls-icons.svg#icon-sound"></use></svg></button>
          <button type="button" id="volume-toggle" class="glass-button" data-panel-toggle="volume-panel" aria-label="聲音音量" aria-controls="volume-panel" aria-expanded="false"><svg aria-hidden="true"><use href="./assets/controls-icons.svg#icon-volume"></use></svg></button>
          <button type="button" id="timer-toggle" class="glass-button" data-panel-toggle="timer-panel" aria-label="聲音定時，目前持續播放" aria-controls="timer-panel" aria-expanded="false"><svg aria-hidden="true"><use href="./assets/controls-icons.svg#icon-timer"></use></svg></button>
        </div>
      </section>
      <section class="settings-zone" aria-label="房間設定">
        <div class="settings-content quiet-ui">
          <div id="brightness-panel" class="control-popover hidden" role="group" aria-label="場景亮度"><label class="sr-only" for="brightness">場景亮度</label><input id="brightness" type="range" min="35" max="100" value="85" /><output class="sr-only" id="brightness-value" for="brightness">85%</output></div>
          <div id="sound-panel" class="control-popover sound-options hidden" role="group" aria-label="選擇環境聲音"><div id="sound-options" class="icon-options"></div><label id="sound-source-control" class="hidden" for="sound-source">環境聲音<select id="sound-source"></select></label></div>
          <div id="volume-panel" class="control-popover hidden" role="group" aria-label="聲音音量"><label class="sr-only" for="volume">音量</label><input id="volume" type="range" min="0" max="100" value="35" /><output class="sr-only" id="volume-value" for="volume">35%</output></div>
          <div id="timer-panel" class="control-popover timer-panel hidden" role="group" aria-labelledby="timer-panel-title"><h2 id="timer-panel-title">聲音時間</h2><div id="timer-options" class="timer-options"></div><label class="hidden" for="sound-timer">播放時間<select id="sound-timer"><option value="0">持續</option><option value="15">15分鐘</option><option value="30">30分鐘</option><option value="60">60分鐘</option></select></label></div>
          <p id="sound-status" class="sr-only" role="status" aria-live="polite">聲音預設關閉。</p>
        </div>
        <div class="settings-footer">
          <div class="room-feedback"><p id="room-message" class="sr-only" role="status" aria-live="polite"></p><button type="button" id="alternate-room" class="glass-button hidden" aria-label="試試另一間房"><svg aria-hidden="true"><use href="./assets/controls-icons.svg#icon-exit"></use></svg></button><button type="button" id="retry-connect" class="glass-button hidden" aria-label="重新連線"><svg aria-hidden="true"><use href="./assets/controls-icons.svg#icon-retry"></use></svg></button></div>
          <div class="room-switch quiet-ui"><button type="button" id="switch-room" class="text-button">換個地方入眠</button></div>
          <button type="button" id="wake-controls" class="wake-controls glass-button" aria-label="收起操作" aria-controls="room-view" aria-expanded="true"><svg aria-hidden="true"><use href="./assets/controls-icons.svg#icon-panel"></use></svg></button>
        </div>
      </section>
      <p class="scene-note sr-only">每顆球，都是此刻在這裡的人。</p>
    </main>
    <dialog id="orientation-dialog" class="orientation-dialog" aria-labelledby="orientation-title">
      <h2 id="orientation-title">請先將手機轉為橫向</h2>
      <div class="orientation-actions"><button type="button" id="orientation-cancel" class="soft-button">取消</button><button type="button" id="orientation-enter" class="primary-button" disabled>進入房間</button></div>
    </dialog>
    <noscript><p class="lobby-message">請開啟瀏覽器的網頁程式功能，才能進入陪睡房。</p></noscript>
  </div>
</body>
</html>
